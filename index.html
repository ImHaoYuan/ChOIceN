<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="ChOIceN · 用当前时间做随机源的抛硬币小工具，支持未来扩展更多随机功能。" />
<meta name="theme-color" content="#0b0f1a" />
<title>ChOIceN · 让随机帮你做决定</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23f0c34d'/%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23a87c1c' stroke-width='2'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<!-- ===== 顶部栏 ===== -->
<header class="topbar">
  <a class="brand" href="#/coin">
    <span class="brand__logo" aria-hidden="true">
      <span class="brand__logo-face">正</span>
    </span>
    <span class="brand__text">
      <strong>ChOIceN</strong>
      <small data-i18n="brand.tagline">让随机帮你做决定</small>
    </span>
  </a>

  <nav class="topbar__nav" aria-label="功能分类">
    <span class="tag" data-i18n="topbar.randomSource">随机源</span>
    <span class="tag tag--ghost">时间 · Time</span>
    <button id="soundToggle" class="icon-btn" type="button" aria-pressed="true" title="音效开关 (M)">
      <span class="icon-btn__icon" id="soundIcon" aria-hidden="true">🔊</span>
      <span class="icon-btn__text" data-i18n="topbar.sound">音效</span>
    </button>
  </nav>
</header>

<div class="layout">

  <!-- ===== 侧边功能选择 ===== -->
  <aside class="sidebar" aria-label="功能选择">
    <p class="sidebar__label" data-i18n="sidebar.label">功能选择</p>

    <nav id="navList" class="nav-list">
      <!-- 由 JS 按功能注册表渲染：见 js/modes.js -->
    </nav>

    <div class="sidebar__foot">
      <p class="sidebar__hint" data-i18n="sidebar.hint">后续功能将以同样的卡片形式加入，接口已预留。</p>
      <button id="resetStats" class="link-btn" type="button" data-i18n="sidebar.reset">清空统计记录</button>
    </div>
  </aside>

  <!-- ===== 主舞台 ===== -->
  <main id="view" class="view" aria-live="polite">
    <!-- 由路由渲染 -->
  </main>
</div>

<!-- ===== 提示条 ===== -->
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="js/rng.js"></script>
<script src="js/store.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
<script src="js/coin.js"></script>
<script src="js/modes.js"></script>
<script src="js/app.js"></script>
</body>
</html>
