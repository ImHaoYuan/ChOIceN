<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="ChOIceN · 用当前时间做随机源的抛硬币小工具，支持未来扩展更多随机功能。" />
<meta name="theme-color" content="#0b0f1a" />
<title>ChOIceN · 让随机帮你做决定</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23f0c34d'/%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23a87c1c' stroke-width='2'/%3E%3C/svg%3E" />

<!-- 首屏防闪：必须在样式表之前决定主题，否则会先渲染深色再跳成浅色。
     判定规则与 js/theme.js 的 themeByTime() 必须一致：
       本地时间 08:00–17:59 → 浅色，其余 → 深色；
       ?theme=light|dark|auto 的覆盖优先；
       其次以用户手动选过的「始终浅色 / 始终深色」偏好为准。 -->
<script>
(function () {
  try {
    var saved = null;
    try {
      var raw = localStorage.getItem('choicen.v1.settings');
      if (raw) saved = (JSON.parse(raw) || {}).theme;
    } catch (e) { /* 隐私模式等场景下忽略 */ }
    var forced = /[?&]theme=(light|dark|auto)\b/.exec(location.search);
    forced = forced ? forced[1] : null;
    var pref = forced || saved;
    var h = new Date().getHours();
    var theme = (pref === 'light' || pref === 'dark')
      ? pref
      : ((h >= 8 && h < 18) ? 'light' : 'dark');
    var root = document.documentElement;
    root.setAttribute('data-theme', theme);
    root.style.colorScheme = theme;      // 顺带切换原生滚动条/控件配色
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme === 'light' ? '#f2f4f9' : '#0b0f1a');
  } catch (e) {}
})();
</script>

<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<!-- ===== 顶部栏 ===== -->
<header class="topbar">
  <a class="brand" href="#/coin">
    <span class="brand__logo" aria-hidden="true">
      <span class="brand__logo-face">正</span>
    </span>
    <span class="brand__text">
      <strong>ChOIceN</strong>
      <small data-i18n="brand.tagline">让随机帮你做决定</small>
    </span>
  </a>

  <nav class="topbar__nav" aria-label="功能分类">
    <!-- 清空统计：从侧边栏移到这里，放在「随机源」左侧 -->
    <button id="resetStats" class="icon-btn" type="button" title="清空全部抛掷统计与历史记录">
      <span class="icon-btn__icon" aria-hidden="true">🧹</span>
      <span class="icon-btn__text" data-i18n="sidebar.reset">清空统计</span>
    </button>
    <!-- 随机源：点按循环 混合 → 加密 → 时间，与主题按钮同一套交互 -->
    <button id="sourceToggle" class="icon-btn" type="button" title="随机源（点按循环切换）">
      <span class="icon-btn__icon" id="sourceIcon" aria-hidden="true">🔀</span>
      <span class="icon-btn__text" id="sourceName">混合</span>
    </button>
    <button id="themeToggle" class="icon-btn" type="button" title="主题：跟随时间 / 浅色 / 深色（点按循环切换）">
      <span class="icon-btn__icon" id="themeIcon" aria-hidden="true">⏱️</span>
      <span class="icon-btn__text" id="themeText">跟随时间</span>
    </button>
    <button id="soundToggle" class="icon-btn" type="button" aria-pressed="true" title="音效开关">
      <span class="icon-btn__icon" id="soundIcon" aria-hidden="true">🔊</span>
      <span class="icon-btn__text" data-i18n="topbar.sound">音效</span>
    </button>
    <!-- 更多选项：把「慢动作 / 显示随机源」这类次要开关收进下拉列表 -->
    <div class="menu" id="moreMenu">
      <button id="moreToggle" class="icon-btn" type="button"
              aria-haspopup="true" aria-expanded="false" aria-controls="morePanel"
              title="更多选项：慢动作 / 显示随机源">
        <span class="icon-btn__icon" aria-hidden="true">⚙️</span>
        <span class="icon-btn__text">更多选项</span>
      </button>
      <!-- 列表内容由 js/app.js 注入（复用 ui.switchControl） -->
      <div class="menu__panel" id="morePanel" role="group" aria-label="更多选项" hidden></div>
    </div>
  </nav>
</header>

<div class="layout">

  <!-- ===== 侧边功能选择 ===== -->
  <aside class="sidebar" aria-label="功能选择">
    <p class="sidebar__label" data-i18n="sidebar.label">功能选择</p>

    <nav id="navList" class="nav-list">
      <!-- 由 JS 按功能注册表渲染：见 js/modes.js -->
    </nav>

    <div class="sidebar__foot">
      <p class="sidebar__hint" data-i18n="sidebar.hint">后续功能将以同样的卡片形式加入，接口已预留。</p>
    </div>
  </aside>

  <!-- ===== 主舞台 ===== -->
  <main id="view" class="view" aria-live="polite">
    <!-- 由路由渲染 -->
  </main>
</div>

<!-- ===== 提示条 ===== -->
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="js/rng.js"></script>
<script src="js/store.js"></script>
<script src="js/audio.js"></script>
<script src="js/theme.js"></script>
<script src="js/ui.js"></script>
<script src="js/coin.js"></script>
<script src="js/modes.js"></script>
<script src="js/app.js"></script>
</body>
</html>
